# Rime schema
# encoding: utf-8

schema:
  schema_id: flypy_yk
  name: 小鶴YK
  version: "0.0.1"
  author:
    - yekingyan
  description: |
    小鶴雙拼五笔形方案，主要用于五笔反查。

switches:
  - name: ascii_mode
    reset: 1
    states: [ 中文, 西文 ]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ ，。, ，． ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - echo_translator
    - punct_translator
    - reverse_lookup_translator
    - table_translator
    - lua_translator@date_translator # 动态日期时间输入
    - lua_translator@number_translator # 数字大写与金额转换 (输入 v123)
    - lua_translator@calculator_translator # 简易表达式计算器 (输入 =1+1)
    - lua_translator@help_translator # 快捷帮助卡片 (输入 help)

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  max_code_length: 4
  auto_select: true
  use_space: false

translator:
  enable_encoder: false  # 纯单字上屏，关闭自动造词
  dictionary: flypy_yk    # 翻译器将调取此字典文件
  enable_completion: true  # 逐鍵提示
  enable_user_dict:  false # 關閉用戶詞典和字頻調整（纯单字确定性排序）
  enable_sentence: false  # 连打模式

punctuator:
  import_preset: default
  full_shape:
    "." : "。"
  half_shape:
    '.' : '。'
    ',' : '，'
    '\' : '、'
    ':' : '：'
    "|" : "|" # 同半角
    "/" : "/" # 同半角
    "#" : "#" # 同半角



key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
    calculator: "^[cC=]+[0-9].*$"
    number: "^[vV]+[0-9].*$"

reverse_lookup:
  dictionary: flypy_yk
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔编码〕

