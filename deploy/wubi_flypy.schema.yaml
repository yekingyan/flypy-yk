# Rime schema settings
# encoding: utf-8

schema:
  schema_id: wubi_flypy
  name: "五笔小鹤"
  version: "0.1.0"
  dependencies:
    - flypy_yk

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, 英 ]
  - name: full_shape
    states: [ 半, 全 ]
  - name: extended_charset
    states: [ 常, 扩 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - lua_translator@date_translator # 动态日期时间输入
    - lua_translator@number_translator # 数字大写与金额转换 (输入 V123)
    - lua_translator@calculator_translator # 简易表达式计算器 (输入 C100*1.13)
    - lua_translator@help_translator # 快捷帮助卡片 (输入 help)
  filters:

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;'"
  max_code_length: 4
  auto_select: true
  use_space: false

translator:
  dictionary: wubi_flypy                # 调取五笔与小鹤双拼联合混输字典
  enable_charset_filter: true           # 开启字符集过滤
  enable_completion: true               # 提前显示编码未输入完整的词条
  enable_sentence: false                # 句子输入模式
  enable_user_dict: false               # 是否开启用户词典
  enable_encoder: false

punctuator:
  import_preset: default
  full_shape:
    "." : "。"
  half_shape:
    '.' : '。'
    ',' : '，'
    '\' : '、'
    ':' : '：'
    "$" : "￥"
    "|" : "|" # 同半角
    "/" : "/" # 同半角
    "%" : "%" # 同半角
    "`" : "`" # 同半角
    "=" : "=" # 同半角
    "*" : "*" # 同半角
    "~" : "~" # 同半角
    "^" : "^" # 同半角
    "@" : "@" # 同半角
    "[" : "[" # 同半角
    "]" : "]" # 同半角

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    calculator: "^C+[0-9].*$"
    number: "^V+[0-9].*$"
